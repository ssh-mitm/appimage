[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "appimage"
dynamic = ["version"]
authors = [
    {name = "SSH-MITM Dev-Team", email = "support@ssh-mitm.at"}
]
maintainers = [
  {name = "Manfred Kaiser", email = "manfred.kaiser@ssh-mitm.at"}
]
description = "AppImage start script to convert the python application in full python environment"
readme = "README.md"
license = {file = "LICENSE"}
keywords = [
    "appimage",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: System :: Networking",
    "Development Status :: 5 - Production/Stable",
]
requires-python = ">= 3.11"

[project.urls]
Homepage = "https://www.ssh-mitm.at"
Documentation = "https://appimage.ssh-mitm.at"
Changelog = "https://github.com/ssh-mitm/appimage/blob/main/CHANGELOG.md"
Source = "https://github.com/ssh-mitm/appimage"
Tracker = "https://github.com/ssh-mitm/appimage/issues"

[tool.hatch.version]
path = "appimage/__init__.py"

[tool.hatch.build]
include = [
    "appimage/**/*.py",
]

[tool.hatch.envs.test]
dependencies = ["pytest"]

[tool.hatch.envs.test.scripts]
run = "pytest tests/"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.envs.lint]
detached = false
dependencies = [
    "bandit",
    "black~=26.0",
    "Flake8-pyproject",
    "flake8",
    "mypy",
    "pylint",
    "pytest",
    "ruff",
]

[tool.hatch.envs.lint.scripts]
check = [
    "black --check appimage",
    "pytest",
    "bandit -r appimage",
    "ruff check appimage",
    "flake8 appimage",
    "pylint appimage",
    "mypy appimage",
]

[tool.flake8]
ignore = ["E203", "E501", "W503"]

[tool.mypy]
strict = true
install_types = true
non_interactive = true

[tool.pylint]
disable = [
    "line-too-long",
]

[tool.pylint.MASTER]
load-plugins = "pylint.extensions.docparams"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # one-blank-line-before-class
    "D213",    # multi-line-summary-second-line
    "E501",    # Line too long
]

[tool.black]
target-version = ["py311"]

[tool.bumpversion]
current_version = "1.1.0"

[[tool.bumpversion.files]]
filename = "appimage/__init__.py"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/ssh-mitm/appimage/compare/{current_version}...main"
replace = """[Unreleased]: https://github.com/ssh-mitm/appimage/compare/{new_version}...main
[{new_version}]: https://github.com/ssh-mitm/appimage/compare/{current_version}...{new_version}"""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] - {now:%Y-%m-%d}"""