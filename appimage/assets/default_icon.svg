<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="256" height="256" viewBox="0 0 48 48">
  <defs>
    <!-- AppImage box background gradient (from appimagetool.svg) -->
    <radialGradient id="ai-bg"
      cx="9.333" cy="8.45" r="20"
      gradientTransform="matrix(0,2.0479,-2.7411,0,47.16,-8.837)"
      gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a3c0d0"/>
      <stop offset="1" stop-color="#427da1"/>
    </radialGradient>
    <linearGradient id="ai-stroke"
      x1="24" y1="5" x2="24" y2="43"
      gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- Shadow below box -->
    <radialGradient id="ai-shadow"
      cx="24" cy="45.5" r="15"
      gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#181818" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#181818" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Drop shadow -->
  <ellipse cx="24" cy="46" rx="16" ry="1.8" fill="url(#ai-shadow)"/>

  <!-- AppImage-style blue box -->
  <rect x="4.5" y="5.47" rx="2.23" ry="2.23" width="39" height="39"
    fill="url(#ai-bg)"
    stroke="url(#ai-stroke)" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Python logo (devicon, PSF trademark) centered in the box -->
  <!-- Nested SVG creates its own viewport so gradients stay in the 128x128 coordinate space -->
