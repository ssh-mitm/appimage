name: Upload Python Package

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:

    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/appimage

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.x'
        cache: 'pip'
    - name: Install hash-verified build dependencies
      run: |
        python -m pip install pip==26.2.1
        pip install --require-hashes -r requirements-build.txt
        pip install build==1.6.0
    - name: Build sdist
      run: python -m build --sdist --no-isolation
    - name: Build hash-verified, reproducible wheel
      run: pip wheel --build-constraint requirements-build.txt --no-deps -w dist .
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
